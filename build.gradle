def cucumber_version = '7.2.3'
def selenium_version = "3.141.59"
def rest_assured_version = "4.5.0"
def driver_manager_version = '5.0.2'
def appium_version = '7.6.0'
def apache_poi_version = "5.0.0"
def xml_apis_version = "1.4.01"

plugins {
    id 'java'
}

group 'com.EmpireLife'
version '1.0-SNAPSHOT'
description 'Testing framework for running qat-'

repositories {
    flatDir {
        dirs 'lib'
    }
    mavenLocal()
    mavenCentral()
}

configurations.all {
    resolutionStrategy {
        force "xml-apis:xml-apis:${xml_apis_version}"
    }
}

dependencies {
    implementation "org.seleniumhq.selenium:selenium-java:${selenium_version}"
    implementation "org.seleniumhq.selenium:selenium-chrome-driver:${selenium_version}"
    implementation "org.seleniumhq.selenium:selenium-edge-driver:${selenium_version}"
    implementation "org.seleniumhq.selenium:selenium-firefox-driver:${selenium_version}"
    implementation "io.cucumber:cucumber-core:${cucumber_version}"
    implementation "io.cucumber:cucumber-picocontainer:${cucumber_version}"
    implementation 'org.testng:testng:7.5'
    testImplementation "io.cucumber:cucumber-java:${cucumber_version}"
    testImplementation "io.cucumber:cucumber-junit:${cucumber_version}"
    implementation "org.apache.commons:commons-math3:3.6.1"
    testImplementation "org.seleniumhq.selenium:selenium-api:${selenium_version}"
    testImplementation 'io.appium:java-client:7.6.0'
    implementation "io.cucumber:cucumber-java:${cucumber_version}"
    implementation "org.seleniumhq.selenium:selenium-api:${selenium_version}"
    implementation "commons-io:commons-io:2.7"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    implementation "io.github.bonigarcia:webdrivermanager:${driver_manager_version}"
    implementation "io.github.bonigarcia:webdrivermanager:${driver_manager_version}"
    implementation 'org.slf4j:slf4j-api:1.7.35'
    implementation 'org.slf4j:slf4j-simple:1.7.35'
    testImplementation 'org.assertj:assertj-core:3.22.0'
    implementation 'org.assertj:assertj-core:3.22.0'
    testImplementation "io.rest-assured:rest-assured:${rest_assured_version}"
    implementation "io.rest-assured:rest-assured:${rest_assured_version}"
    implementation 'org.json:json:20211205'
    implementation "com.googlecode.json-simple:json-simple:1.1.1"
    implementation 'org.apache.pdfbox:pdfbox:2.0.24'
    implementation 'io.github.sukgu:automation:0.1.3'
    implementation 'io.cucumber:gherkin:22.0.0'
    implementation 'io.github.cdimascio:dotenv-java:2.2.3'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version:'2.11.2'
    implementation group: 'com.fasterxml.jackson.datatype', name: 'jackson-datatype-jsr310', version: '2.11.2'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.2.10'
    implementation group: 'org.apache.httpcomponents', name: 'httpcore', version: '4.4.13'
    implementation group: 'com.epam.reportportal', name: 'client-java', version: '5.1.4'
    implementation group: 'com.epam.reportportal', name: 'agent-java-cucumber6', version: '5.1.1'
    implementation group: 'com.epam.reportportal', name: 'agent-java-junit5', version: '5.1.1'
    implementation group: 'com.epam.reportportal', name: 'httpclient-repacked', version: '1.0.2'
    implementation group: 'org.awaitility', name: 'awaitility', version: '4.0.3'
    implementation group: 'net.lightbody.bmp', name: 'browsermob-core', version: '2.1.5'
    implementation group: 'io.percy', name: 'percy-java-selenium', version: '0.1.4'
    implementation 'org.jsoup:jsoup:1.14.3'
    implementation group: 'org.apache.poi', name: 'poi', version: apache_poi_version
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: apache_poi_version
    implementation group: 'org.skyscreamer', name: 'jsonassert', version: '1.5.0'
    implementation "io.appium:java-client:${appium_version}"
    implementation 'org.jetbrains:annotations:22.0.0'
    implementation 'net.foragerr.jmeter:jmeter-gradle-plugin:0.1.4-2.13'
    implementation group: 'com.jayway.jsonpath', name: 'json-path', version: '2.6.0'
    implementation group: 'net.sourceforge.jtds', name: 'jtds', version: '1.3.1'
    implementation group: 'xml-apis', name: 'xml-apis', version: xml_apis_version
}

test {
    useJUnitPlatform()
}