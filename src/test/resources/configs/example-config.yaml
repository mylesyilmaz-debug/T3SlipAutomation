environment:
  name: PORTALSTAGE
  filepath: "./environments/stage.env"

profiles:
  - name: chrome-desktop
    driverFramework: selenium
    capabilities:
      - name: browser.name
        value: chrome
    arguments:
      - "--headless"
      - "--disable-gpu"
      - "--ignore-certificate-errors"
      - "--start-fullscreen"
    preferences:
      - name: plugins.always_open_pdf_externally
        value: false

  - name: iphone-13-browserstack
    driverFramework: browserstack
    capabilities:
      - name: os_version
        value: 15
      - name: device
        value: iPhone 13
      - name: real_mobile
        value: true