# This is an example config file for the testing framework. Feel free to repurpose/rename this file to fit your needs.

environment:
  name: EXAMPLE
  filepath: "./environments/examples/example.env"

# TODO: configure desired device profiles
profiles:
  - name: chrome-desktop
    driverFramework: selenium
    capabilities:
      - name: browser.name
        value: chrome
    arguments:
      - "--headless"
      - "--disable-gpu"
      - "--ignore-certificate-errors"
      - "--start-fullscreen"
    preferences:
      - name: plugins.always_open_pdf_externally
        value: false

  - name: iphone-12-browserstack
    driverFramework: browserstack
    capabilities:
      - name: os_version
        value: 14
      - name: device
        value: iPhone 12
      - name: real_mobile
        value: true
      - name: project
        value: group-engagement

  - name: iphone-12-appium
    driverFramework: appium
    capabilities:
      - name: platformName
        value: iOS
      - name: platformVersion
        value: 14
      - name: deviceName
        value: iPhone 12
      - name: automationName
        value: XCUITest