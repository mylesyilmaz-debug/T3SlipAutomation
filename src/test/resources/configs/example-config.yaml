environment:
  name: PORTALSTAGE
  file: "./environments/stage.env"

profiles:
  - name: "chrome-desktop"
    driverFramework: "base"
    proxy:
      port: 9090
      enabled: false
    capabilities:
      - name: 'browser.name'
        value: 'chrome'
      - name: 'browser.version'
        value: '99.0'
    arguments:
      - "--headless"
      - "--ignore-certificate-errors"
      - "--start-fullscreen"
    preferences:
      - name: "plugins.always_open_pdf_externally"
        value: false

  - name: iphone-13-browserstack
    driverFramework: browserstack
    capabilities:
      - name: "os_version"
        value: "15"
      - name: "device"
        value: "iPhone 13"
      - name: "real_mobile"
        value: "true"