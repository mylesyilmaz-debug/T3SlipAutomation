# This is largely pulled form https://springframework.guru/log4j-2-configuration-using-yaml/ as I haven't worked with log4j before

configutation:
  name: Default
  properties:
    property:
      name: log-path
      value: "logs"

  appenders:
    console:
      name: consoleAppender
      target: SYSTEM_OUT
      patternLayout:
        pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1}:%M - %msg%n"

    file:
      name: fileAppender
      fileName: ${log-path}/logfile.log
      patternLayout:
        pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1}:%M - %msg%n"

    rollingFile:
      - name: rollingFileAppender
        fileName: ${log-path}/rollingfile.log
        filePattern: "logs/archive/rollingfile-%d{yyyy-MM-dd-hh-mm}.log.gz"
        patternLayout:
          pattern: "[%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1}:%M - %msg%n"
        policies:
          sizeBasedTriggeringPolicy:
            size: 128 KB
          onStartupTriggeringPolicy:
            size: 1
        defaultRollOverStrategy:
          max: 300

  loggers:
    root:
      level: debug # The global floor for our logging level, anything below this value will not be captured
      appenderRef:
        - ref: consoleAppender
          level: info
        - ref: rollingFileAppender
    logger:
      - name: ca.empire
        appenderRef:
          - ref: fileAppender
            level: error